name: Snap-Fit Holder self-test

on:
  push:
    paths:
      - 'snap-fit-holder/**'
      - '.github/workflows/snap-fit-holder.yml'
  pull_request:
    paths:
      - 'snap-fit-holder/**'
      - '.github/workflows/snap-fit-holder.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check snap-fit-holder/core.js
      - run: node --check snap-fit-holder/app-v11.js
      - run: node snap-fit-holder/test.mjs
