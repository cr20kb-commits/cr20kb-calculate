name: OPS Snap-Fit v1.2 live smoke

on:
  push:
    paths:
      - '.github/workflows/snap-fit-v12-live-smoke.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for guarded CR20KB deployment
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA='7d79c595b32b355cde79eb13f458b6e602199d48'
          for attempt in $(seq 1 18); do
            stamp="${TARGET_SHA:0:12}-${attempt}-$(date +%s)"
            page="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://cr20kb.com/snap-fit-holder/?_=${stamp}" 2>/dev/null || true)"
            core="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://cr20kb.com/snap-fit-holder/core.js?_=${stamp}" 2>/dev/null || true)"
            info="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://cr20kb.com/build-info.json?_=${stamp}" 2>/dev/null || true)"
            if grep -Fq 'TEST · v1.2' <<<"$page" \
              && grep -Fq 'snapfit4' <<<"$page" \
              && grep -Fq 'screw-access v1.2' <<<"$core" \
              && grep -Fq 'SCREW_TOOL_RADIUS' <<<"$core" \
              && grep -Fq "$TARGET_SHA" <<<"$info"; then
                echo "SNAP_FIT_V12_LIVE_PASS sha=$TARGET_SHA attempt=$attempt"
                exit 0
            fi
            echo "attempt $attempt: v1.2 deployment not fully visible yet"
            sleep 30
          done
          echo 'SNAP_FIT_V12_LIVE_FAIL: guarded deployment did not become fully visible in time' >&2
          exit 1
