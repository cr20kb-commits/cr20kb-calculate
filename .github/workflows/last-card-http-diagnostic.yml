name: OPS Last Card HTTP diagnostic
on:
  push:
    paths:
      - '.github/workflows/last-card-http-diagnostic.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect Last Card responses
        shell: bash
        run: |
          set -u
          for path in \
            /games/ \
            /games/last-card/ \
            /games/last-card/index.html \
            /games/last-card/styles.css \
            /games/last-card/app.js \
            /games/ukhylant/ \
            /games/engineering-humor/; do
            echo "===== $path ====="
            curl -sS -D - -o /tmp/body --max-time 25 "https://cr20kb.com${path}?_=$(date +%s)" | sed -n '1,20p' || true
            echo "BODY:"
            head -c 240 /tmp/body 2>/dev/null || true
            echo
          done
          echo 'BUILD INFO:'
          curl -fsS --max-time 25 "https://cr20kb.com/build-info.json?_=$(date +%s)" || true
          echo
