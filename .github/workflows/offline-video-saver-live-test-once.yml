name: Offline Video Saver Live Test Once

on:
  push:
    paths:
      - ".github/workflows/offline-video-saver-live-test-once.yml"

permissions:
  contents: read

jobs:
  live-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: offline-video-saver
    steps:
      - uses: actions/checkout@v4

      - name: Build application image
        run: docker build -t cr20kb-offline-video-saver:live-test .

      - name: Inspect playlist metadata
        run: |
          docker run --rm \
            --entrypoint /usr/local/bin/yt-dlp-cr20kb \
            cr20kb-offline-video-saver:live-test \
            --ignore-config \
            --flat-playlist \
            --playlist-end 3 \
            --no-warnings \
            --js-runtimes node \
            --print '%(playlist_index)s | %(id)s | %(duration_string)s | %(title)s' \
            'https://www.youtube.com/watch?v=Ss8lkI-7Qc8&list=PLybBpPCOgFt4IANUx-EvScY8W9mbGpGYo'

      - name: Run one-minute end-to-end sample through the web app
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p live-data
          chmod 0777 live-data

          cat > live-yt-dlp-test-wrapper <<'SH'
          #!/bin/sh
          set -eu
          for arg in "$@"; do
            if [ "$arg" = "--flat-playlist" ]; then
              exec /usr/local/bin/yt-dlp-cr20kb "$@"
            fi
          done
          exec /usr/local/bin/yt-dlp-cr20kb \
            --download-sections '*0-60' \
            --force-keyframes-at-cuts \
            "$@"
          SH
          chmod 0555 live-yt-dlp-test-wrapper

          docker network create ovs-live-test >/dev/null

          docker run -d \
            --name ovs-pot-provider \
            --network ovs-live-test \
            --init \
            brainicism/bgutil-ytdlp-pot-provider:1.3.2

          docker run -d \
            --name ovs-live-test \
            --network ovs-live-test \
            --cpus 2 \
            --memory 4g \
            -p 127.0.0.1:18081:8000 \
            -e APP_ACCESS_KEY=ci-live-test \
            -e COOKIE_SECURE=false \
            -e MAX_PLAYLIST_ITEMS=1 \
            -e MIN_FREE_GIGABYTES=0 \
            -e JOB_TTL_HOURS=1 \
            -e SCAN_TIMEOUT_SECONDS=300 \
            -e DOWNLOAD_TIMEOUT_SECONDS=900 \
            -e TRANSCODE_TIMEOUT_SECONDS=900 \
            -e POT_PROVIDER_URL=http://ovs-pot-provider:4416 \
            -e YOUTUBE_PLAYER_CLIENT=mweb \
            -e YTDLP_BIN=/usr/local/bin/yt-dlp-live-test \
            -v "$PWD/live-data:/data" \
            -v "$PWD/live-yt-dlp-test-wrapper:/usr/local/bin/yt-dlp-live-test:ro" \
            cr20kb-offline-video-saver:live-test

          cleanup() {
            docker logs ovs-pot-provider || true
            docker logs ovs-live-test || true
            docker rm -f ovs-live-test ovs-pot-provider >/dev/null 2>&1 || true
            docker network rm ovs-live-test >/dev/null 2>&1 || true
            sudo rm -rf live-data live-result.zip cookies.txt live-yt-dlp-test-wrapper
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18081/healthz | grep -q '"ok":true'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Service did not become healthy"
              exit 1
            fi
            sleep 1
          done

          curl -fsS \
            -c cookies.txt \
            -H 'Content-Type: application/json' \
            --data '{"key":"ci-live-test"}' \
            http://127.0.0.1:18081/api/session \
            >/dev/null

          CREATE_RESPONSE=$(curl -fsS \
            -b cookies.txt \
            -H 'Content-Type: application/json' \
            --data '{"url":"https://www.youtube.com/watch?v=Ss8lkI-7Qc8&list=PLybBpPCOgFt4IANUx-EvScY8W9mbGpGYo","profile":"tiny","rights_confirmed":true}' \
            http://127.0.0.1:18081/api/jobs)

          JOB_ID=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$CREATE_RESPONSE")
          echo "Created live test job: $JOB_ID"

          FINAL_STATE=""
          for attempt in $(seq 1 120); do
            STATE=$(curl -fsS -b cookies.txt "http://127.0.0.1:18081/api/jobs/$JOB_ID")
            STATUS=$(python -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$STATE")
            STAGE=$(python -c 'import json,sys; print(json.load(sys.stdin)["stage"])' <<<"$STATE")
            PROGRESS=$(python -c 'import json,sys; print(round(float(json.load(sys.stdin)["progress"])*100,1))' <<<"$STATE")
            echo "status=$STATUS stage=$STAGE progress=${PROGRESS}%"

            if [ "$STATUS" = "ready" ]; then
              FINAL_STATE="$STATE"
              break
            fi
            if [ "$STATUS" = "error" ]; then
              echo "$STATE"
              exit 1
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "Live job timed out"
              echo "$STATE"
              exit 1
            fi
            sleep 5
          done

          FINAL_STATE="$FINAL_STATE" python - <<'PY'
          import json
          import os

          state = json.loads(os.environ["FINAL_STATE"])
          source = int(state["input_bytes"])
          result = int(state["output_bytes"])
          saved = int(state["saved_bytes"])
          percent = saved / source * 100 if source else 0
          print(f"title={state['title']}")
          print(f"completed_items={state['completed_items']}")
          print(f"input_bytes={source}")
          print(f"output_bytes={result}")
          print(f"saved_bytes={saved}")
          print(f"saved_percent={percent:.2f}")
          print(f"warnings={state['warnings']}")
          PY

          curl -fsS \
            -b cookies.txt \
            -o live-result.zip \
            "http://127.0.0.1:18081/api/jobs/$JOB_ID/download"

          test -s live-result.zip
          unzip -t live-result.zip
          unzip -l live-result.zip

          curl -fsS \
            -b cookies.txt \
            -X DELETE \
            "http://127.0.0.1:18081/api/jobs/$JOB_ID" \
            >/dev/null
