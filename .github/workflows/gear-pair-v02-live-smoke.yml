name: OPS Gear Pair v0.2 live smoke

on:
  push:
    paths:
      - '.github/workflows/gear-pair-v02-live-smoke.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for guarded CR20KB deployment
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA='68d805b9993fe944c722b102b795596192ff9b10'
          for attempt in $(seq 1 18); do
            stamp="${TARGET_SHA:0:12}-${attempt}-$(date +%s)"
            page="$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "https://cr20kb.com/gen/gear/?_=${stamp}" 2>/dev/null || true)"
            model="$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "https://cr20kb.com/gen/gear/model-v02.js?_=${stamp}" 2>/dev/null || true)"
            app="$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "https://cr20kb.com/gen/gear/app-v02.js?_=${stamp}" 2>/dev/null || true)"
            overlay="$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "https://cr20kb.com/garden-v3/gear-pair-overlay.js?_=${stamp}" 2>/dev/null || true)"
            loader="$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "https://cr20kb.com/garden-v3/humor-test-overlay.js?_=${stamp}" 2>/dev/null || true)"
            root="$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "https://cr20kb.com/?_=${stamp}" 2>/dev/null || true)"
            info="$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "https://cr20kb.com/build-info.json?_=${stamp}" 2>/dev/null || true)"
            if grep -Fq 'Шестерёночки и колёсики' <<<"$page" \
              && grep -Fq "productName:'Spur Gear Pair'" <<<"$model" \
              && grep -Fq "Spur Gear Pair · CR20KB" <<<"$app" \
              && grep -Fq "ru:{title:'Шестерёночки и колёсики'" <<<"$overlay" \
              && grep -Fq "en:{title:'Spur Gear Pair'" <<<"$overlay" \
              && grep -Fq '/garden-v3/gear-pair-overlay.js?v=20260827-gearpairname1' <<<"$loader" \
              && grep -Fq 'humor-test-overlay.js?v=20260827-gearpairname1' <<<"$root" \
              && grep -Fq 'data-category="make"' <<<"$overlay" \
              && grep -Fq "$TARGET_SHA" <<<"$info"; then
                echo "GEAR_PAIR_NAMES_LIVE_PASS sha=$TARGET_SHA attempt=$attempt"
                exit 0
            fi
            echo "attempt $attempt: approved Gear Pair names not fully visible yet"
            sleep 30
          done
          echo 'GEAR_PAIR_NAMES_LIVE_FAIL' >&2
          exit 1
