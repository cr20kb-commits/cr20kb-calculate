name: OPS Snap-Fit width20 live smoke

on:
  push:
    paths:
      - '.github/workflows/snap-fit-width20-live-smoke.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for guarded CR20KB deployment
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA='e5b4cebb0291f804a2fca599140e0c0cf6b9409d'
          for attempt in $(seq 1 18); do
            stamp="${TARGET_SHA:0:12}-${attempt}-$(date +%s)"
            page="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://cr20kb.com/snap-fit-holder/?_=${stamp}" 2>/dev/null || true)"
            app="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://cr20kb.com/snap-fit-holder/app-v11.js?_=${stamp}" 2>/dev/null || true)"
            info="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://cr20kb.com/build-info.json?_=${stamp}" 2>/dev/null || true)"
            if grep -Fq 'value="20"' <<<"$page" \
              && grep -Fq 'snapfit5' <<<"$page" \
              && grep -Fq 'Math.min(Math.max(D,12),20)' <<<"$app" \
              && grep -Fq "$TARGET_SHA" <<<"$info"; then
                echo "SNAP_FIT_WIDTH20_LIVE_PASS sha=$TARGET_SHA attempt=$attempt"
                exit 0
            fi
            echo "attempt $attempt: width20 deployment not fully visible yet"
            sleep 30
          done
          echo 'SNAP_FIT_WIDTH20_LIVE_FAIL' >&2
          exit 1
