name: OPS Gear canonical live smoke

on:
  push:
    paths:
      - '.github/workflows/gear-canonical-live-smoke.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for canonical Gear Pair deployment
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA='441e407e985cf3458800ad2035fc2b7524828d36'
          for attempt in $(seq 1 18); do
            stamp="${TARGET_SHA:0:12}-${attempt}-$(date +%s)"
            root="$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "https://cr20kb.com/?_=${stamp}" 2>/dev/null || true)"
            garden="$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "https://cr20kb.com/garden-v3/app.js?_=${stamp}" 2>/dev/null || true)"
            loader="$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "https://cr20kb.com/garden-v3/humor-test-overlay.js?_=${stamp}" 2>/dev/null || true)"
            info="$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "https://cr20kb.com/build-info.json?_=${stamp}" 2>/dev/null || true)"
            if grep -Fq "id:'gear-pair',icon:'⚙⚙',status:'TEST'" <<<"$garden" \
              && grep -Fq "title:{ru:'Шестерёночки и колёсики',en:'Spur Gear Pair'}" <<<"$garden" \
              && grep -Fq "url:'/gen/gear/'" <<<"$garden" \
              && grep -Fq 'app.js?v=20260827-gearpaircanon1' <<<"$root" \
              && ! grep -Fq 'gear-pair-overlay.js' <<<"$loader" \
              && grep -Fq "$TARGET_SHA" <<<"$info"; then
                echo "GEAR_CANONICAL_LIVE_PASS sha=$TARGET_SHA attempt=$attempt"
                exit 0
            fi
            echo "attempt $attempt: canonical Gear Pair not fully visible yet"
            sleep 30
          done
          echo 'GEAR_CANONICAL_LIVE_FAIL' >&2
          exit 1
