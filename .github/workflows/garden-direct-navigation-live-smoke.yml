name: OPS Garden direct navigation live smoke

on:
  push:
    paths:
      - '.github/workflows/garden-direct-navigation-live-smoke.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for guarded CR20KB deployment
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA='0ddeb483a1ef7ad9070c36bacff533f17eecdc46'
          for attempt in $(seq 1 18); do
            stamp="${TARGET_SHA:0:12}-${attempt}-$(date +%s)"
            root="$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "https://cr20kb.com/?_=${stamp}" 2>/dev/null || true)"
            app="$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "https://cr20kb.com/garden-v3/app.js?_=${stamp}" 2>/dev/null || true)"
            analytics="$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "https://cr20kb.com/analytics-config.js?_=${stamp}" 2>/dev/null || true)"
            school="$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "https://cr20kb.com/garden-v3/school-name-tag-overlay.js?_=${stamp}" 2>/dev/null || true)"
            info="$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "https://cr20kb.com/build-info.json?_=${stamp}" 2>/dev/null || true)"
            last_card_code="$(curl -LsS --max-time 25 -o /dev/null -w '%{http_code}' "https://cr20kb.com/games/last-card/?_=${stamp}" 2>/dev/null || true)"
            if grep -Fq 'app.js?v=20260827-directnav1' <<<"$root" \
              && grep -Fq 'analytics-config.js?v=20260827-schoolpos1' <<<"$root" \
              && grep -Fq 'if(p.url){' <<<"$app" \
              && grep -Fq "location.href=localizedHref(p.url)" <<<"$app" \
              && grep -Fq 'school-name-tag-overlay.js?v=20260827-schoolpos1' <<<"$analytics" \
              && grep -Fq 'function chooseDesktopPosition' <<<"$school" \
              && grep -Fq 'occupied.some(box=>overlaps(candidate,box))' <<<"$school" \
              && grep -Fq "$TARGET_SHA" <<<"$info" \
              && [[ "$last_card_code" == '200' ]]; then
                echo "GARDEN_DIRECT_RUNTIME_LIVE sha=$TARGET_SHA attempt=$attempt"
                exit 0
            fi
            echo "attempt $attempt: direct-navigation/collision release not fully visible yet; last-card=$last_card_code"
            sleep 30
          done
          echo 'GARDEN_DIRECT_RUNTIME_TIMEOUT' >&2
          exit 1

      - name: Install browser driver
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund puppeteer-core@24.16.0 >/dev/null

      - name: Click every public Garden product
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          CHROME="$CHROME" node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const assert = require('node:assert/strict');
          (async()=>{
            const origin = 'https://cr20kb.com';
            const products = [
              ['make','fastener','/fastener-ui/'],
              ['make','gear-pair','/gen/gear/'],
              ['make','plate','/plate-keychain/'],
              ['make','optical','/optical-transfer/'],
              ['make','crosstext','/crosstext-ui/'],
              ['make','school-tag','/school-name-tag/'],
              ['calculate','lifepo4','/lifepo4/'],
              ['calculate','fuel','/fuel-range/'],
              ['calculate','poisson','/tools/'],
              ['calculate','life-cost','/life-cost/'],
              ['medicine','medmemo','/medicine/'],
              ['play','stalker','/stalker-loot/'],
              ['play','ukhylant','/games/ukhylant/'],
              ['play','last-card','/games/last-card/'],
              ['play','humor','/games/engineering-humor/'],
              ['anti','natal','/antiscience/natal-chart/'],
              ['anti','astro-oracle','/antiscience/astro-oracle/'],
              ['anti','myths','/antiscience/coincidence-meter/'],
              ['anti','velvet-eye','/antiscience/velvet-eye/'],
              ['learn','english','/english-builder/'],
              ['learn','knowledge','/knowledge/'],
              ['library','project-library','/library/'],
              ['edc','knife-hrc','/edc/knives/'],
              ['edc','s-clip','/edc/s-clip/'],
              ['repair','vacuum','/vacuum-adapter/'],
              ['repair','snap-fit-holder','/snap-fit-holder/']
            ];
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME,
              headless: true,
              args: ['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']
            });
            try {
              for (let i=0;i<products.length;i++) {
                const [category,id,expectedPath] = products[i];
                const page = await browser.newPage();
                await page.setViewport({width:1600,height:900});
                await page.goto(`${origin}/?lang=ru&qa=direct-${i}-${Date.now()}`, {waitUntil:'domcontentloaded', timeout:30000});
                await page.waitForSelector(`.category[data-id="${category}"]`, {timeout:10000});
                await page.click(`.category[data-id="${category}"]`);
                const selector = `.node.product[data-id="${id}"]`;
                await page.waitForFunction(sel => {
                  const el=document.querySelector(sel);
                  return !!el && !el.classList.contains('hidden-node') && getComputedStyle(el).display!=='none';
                }, {timeout:10000}, selector);
                await page.evaluate(() => {
                  localStorage.removeItem('__gardenPanelOpenAtNav');
                  addEventListener('beforeunload', () => {
                    const panel=document.getElementById('detailPanel');
                    localStorage.setItem('__gardenPanelOpenAtNav',panel?.classList.contains('open')?'1':'0');
                  }, {once:true});
                });
                await Promise.all([
                  page.waitForNavigation({waitUntil:'domcontentloaded',timeout:30000}),
                  page.click(selector)
                ]);
                const actualPath = new URL(page.url()).pathname;
                const panelState = await page.evaluate(()=>localStorage.getItem('__gardenPanelOpenAtNav'));
                assert.equal(actualPath, expectedPath, `${id}: expected ${expectedPath}, got ${actualPath}`);
                assert.equal(panelState, '0', `${id}: detail panel opened before navigation`);
                await page.close();
                console.log(`DIRECT_OK ${category}/${id} -> ${actualPath}`);
              }
              const page=await browser.newPage();
              await page.goto(`${origin}/?lang=ru&qa=hidden-${Date.now()}`, {waitUntil:'domcontentloaded',timeout:30000});
              await page.click('.category[data-id="anti"]');
              const handshakeVisible=await page.$eval('.node.product[data-id="handshake"]', el=>getComputedStyle(el).display!=='none').catch(()=>false);
              assert.equal(handshakeVisible,false,'archived handshake product became public');
              await page.close();
            } finally {
              await browser.close();
            }
            console.log(`GARDEN_DIRECT_CLICK_PASS products=${products.length}`);
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

      - name: Verify every target route returns content
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            /fastener-ui/ /gen/gear/ /plate-keychain/ /optical-transfer/ /crosstext-ui/ /school-name-tag/
            /lifepo4/ /fuel-range/ /tools/ /life-cost/ /medicine/ /stalker-loot/
            /games/ukhylant/ /games/last-card/ /games/engineering-humor/
            /antiscience/natal-chart/ /antiscience/astro-oracle/ /antiscience/coincidence-meter/ /antiscience/velvet-eye/
            /english-builder/ /knowledge/ /library/ /edc/knives/ /edc/s-clip/ /vacuum-adapter/ /snap-fit-holder/
          )
          for route in "${routes[@]}"; do
            code="$(curl -LsS --max-time 25 -o /dev/null -w '%{http_code}' "https://cr20kb.com${route}?qa=$(date +%s%N)")"
            [[ "$code" == '200' ]] || { echo "ROUTE_FAIL $route HTTP $code" >&2; exit 1; }
            echo "ROUTE_OK $route"
          done
