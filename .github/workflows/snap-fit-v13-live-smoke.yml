name: OPS Snap-Fit v1.3 live smoke

on:
  push:
    paths:
      - '.github/workflows/snap-fit-v13-live-smoke.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for guarded CR20KB deployment
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA='986ad6714e9dcfe09fe4ab2104c45d9360e7e6a5'
          for attempt in $(seq 1 18); do
            stamp="${TARGET_SHA:0:12}-${attempt}-$(date +%s)"
            page="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://cr20kb.com/snap-fit-holder/?_=${stamp}" 2>/dev/null || true)"
            core="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://cr20kb.com/snap-fit-holder/core.js?_=${stamp}" 2>/dev/null || true)"
            app="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://cr20kb.com/snap-fit-holder/app-v11.js?_=${stamp}" 2>/dev/null || true)"
            info="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://cr20kb.com/build-info.json?_=${stamp}" 2>/dev/null || true)"
            if grep -Fq 'TEST · v1.3' <<<"$page" \
              && grep -Fq 'id="holeD"' <<<"$page" \
              && grep -Fq 'value="6.5"' <<<"$page" \
              && grep -Fq '20260826-snapfit6' <<<"$page" \
              && grep -Fq 'function defaultHoleD' <<<"$core" \
              && grep -Fq 'hole-default v1.3' <<<"$core" \
              && grep -Fq 'autoHole=true' <<<"$app" \
              && grep -Fq "$TARGET_SHA" <<<"$info"; then
                echo "SNAP_FIT_V13_LIVE_PASS sha=$TARGET_SHA attempt=$attempt"
                exit 0
            fi
            echo "attempt $attempt: v1.3 deployment not fully visible yet"
            sleep 30
          done
          echo 'SNAP_FIT_V13_LIVE_FAIL' >&2
          exit 1
