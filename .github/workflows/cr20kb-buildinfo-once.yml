name: OPS CR20KB build info once
on:
  push:
    paths:
      - '.github/workflows/cr20kb-buildinfo-once.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read live build info
        shell: bash
        run: |
          set -euo pipefail
          echo BUILD_INFO_START
          curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "https://cr20kb.com/build-info.json?_=$(date +%s)"
          echo
          echo ROOT_ASSET
          curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "https://cr20kb.com/?_=$(date +%s)" | grep -o 'garden-v3/app.js?v=[^"<]*' | head -1 || true
          echo GEAR_IN_GARDEN
          curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "https://cr20kb.com/garden-v3/app.js?_=$(date +%s)" | grep -F "id:'gear-pair'" || true
