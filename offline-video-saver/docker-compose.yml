services:
  offline-video-saver:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8787:8000"
    volumes:
      - video-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    cpus: 2.0

volumes:
  video-data:
