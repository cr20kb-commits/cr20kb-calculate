services:
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2
    restart: unless-stopped
    init: true
    expose:
      - "4416"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5

  offline-video-saver:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POT_PROVIDER_URL: http://pot-provider:4416
      YOUTUBE_PLAYER_CLIENT: mweb
    depends_on:
      - pot-provider
    ports:
      - "127.0.0.1:8787:8000"
    volumes:
      - video-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    cpus: 2.0

volumes:
  video-data:
